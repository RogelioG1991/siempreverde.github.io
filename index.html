<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roger Deportes GT</title>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#212121;color:#fff;font-family:Ubuntu,sans-serif}
header{background:linear-gradient(90deg,#111,#8b0000);padding:30px;text-align:center;box-shadow:0 3px 12px #000}
header img{width:90px;height:90px;border-radius:50%;border:3px solid #18ffff}
header h1{margin:10px 0 5px;font-size:2.4rem} header p{color:#18ffff}
.container{max-width:1100px;margin:30px auto;padding:20px}
details{background:#2c2c2c;border-radius:12px;margin:16px 0;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,.4)}
summary{padding:18px;cursor:pointer;font-size:1.1rem;font-weight:bold}
.panel{padding:15px;border-top:1px solid #444}
.panel a{display:block;background:#18ffff;color:#111;text-decoration:none;padding:12px;margin:10px 0;border-radius:8px;font-weight:bold}
.panel a:hover{background:#00cfd1}
footer{text-align:center;color:#aaa;padding:30px}
</style></head>
<body>
<header>
<img src="rogerd.png"><h1>Roger Deportes GT</h1><p>Transmisiones Deportivas</p>
</header>
<div class="container">
<h2>⚽ Transmisiones en Vivo</h2>
<div id="transmisiones"></div>
</div>
<footer>© 2026 Roger Deportes GT</footer>
<script>
const archivos=[...Array(20)].map((_,i)=>`TR${i+1}.html`);
const c=document.getElementById('transmisiones');
async function cargar(){
 for(const a of archivos){
  try{
   let t=await fetch(a+'?v='+Date.now()).then(r=>r.text());
   let d=new DOMParser().parseFromString(t,'text/html');
   let titulo=(d.querySelector('h2')||{}).innerText||a;
   let links=[...d.querySelectorAll('.links a')].slice(0,3);
   let det=document.createElement('details');
   det.innerHTML=`<summary>⚽ ${titulo}</summary><div class="panel"></div>`;
   let p=det.querySelector('.panel');
   if(!links.length)p.innerHTML="<em>Sin enlaces.</em>";
   links.forEach((l,i)=>p.innerHTML+=`<a target="_blank" href="${l.href}">▶ Opción ${i+1}</a>`);
   c.appendChild(det);
  }catch(e){}
 }
}
cargar();
</script>
</body></html>
